<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08121c">
<title>No_Gas_Labs — The Commons</title>
<style>
:root{color-scheme:dark;--ink:#e9f3f7;--muted:#91a9b6;--glass:rgba(7,18,28,.82);--line:rgba(151,204,220,.22);--cyan:#68e0d0;--gold:#f3c978}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121c;color:var(--ink);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}#world{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 12px 36px #0005}.brand{position:absolute;top:16px;left:16px;padding:12px 15px;max-width:min(78vw,330px)}.brand strong{display:block;letter-spacing:.13em;font-size:12px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.status{position:absolute;top:16px;right:16px;padding:9px 12px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px}.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 15px;color:#d6e6eb;font-size:13px;white-space:nowrap;text-align:center}.hint b{color:var(--cyan)}#nearby{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font-size:12px;color:var(--cyan);text-shadow:0 2px 10px #000;white-space:nowrap}#dialog{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(620px,calc(100vw - 28px));padding:17px;pointer-events:auto;display:none}#dialog.open{display:block}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.who{font-weight:700}.role{font-size:12px;color:var(--muted);margin-top:2px}.close{border:1px solid var(--line);background:#132736;color:var(--ink);border-radius:9px;padding:7px 10px}.messages{max-height:34vh;overflow:auto;margin:14px 0;display:flex;flex-direction:column;gap:9px}.msg{padding:10px 12px;border-radius:12px;background:#132735;color:#dce9ed;font-size:13px;white-space:pre-wrap}.msg.user{background:#173d3b;align-self:flex-end;max-width:90%}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0;background:#07121b;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font:inherit}.composer button,.action{border:0;border-radius:10px;padding:10px 14px;background:var(--cyan);color:#06201f;font-weight:700}.fine{font-size:10px;color:var(--muted);margin-top:9px}.controls{position:absolute;bottom:18px;left:18px;display:none;pointer-events:auto}.stick{width:112px;height:112px;border-radius:50%;border:1px solid #b7e6eb55;background:#06131c77;position:relative;touch-action:none}.nub{position:absolute;left:37px;top:37px;width:38px;height:38px;border-radius:50%;background:#7ce6d1bb;border:1px solid #d7fff0}.mobile-action{display:none;position:absolute;right:20px;bottom:34px;pointer-events:auto;border-radius:50%;width:66px;height:66px}.legend{position:absolute;right:16px;bottom:18px;padding:10px 12px;color:var(--muted);font-size:11px}.legend div+div{margin-top:4px}.key{display:inline-block;border:1px solid #7c9aa555;border-radius:5px;padding:1px 5px;color:var(--ink);margin-right:4px}@media(max-width:700px){.status{top:70px;left:16px;right:auto}.legend{display:none}.controls{display:block}.mobile-action{display:block}.hint{bottom:142px;font-size:11px}#nearby{bottom:190px}#dialog{bottom:12px}.brand{max-width:75vw}}
</style>
</head>
<body>
<div id="world"></div>
<div id="hud">
 <div class="brand panel"><strong>NO_GAS_LABS™ · THE COMMONS</strong><span>A place to encounter the intelligence at work</span></div>
 <div class="status panel"><i class="dot"></i><span id="connection">LOCAL WORLD · AI NOT CONNECTED</span></div>
 <div id="nearby"></div>
 <div class="hint panel" id="hint">Move with <b>W A S D</b> · Look with mouse · Walk up to someone</div>
 <div class="legend panel"><div><span class="key">W A S D</span> move</div><div><span class="key">Mouse</span> look</div><div><span class="key">E</span> speak</div><div><span class="key">Esc</span> leave conversation</div></div>
 <div class="controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div></div>
 <button class="action mobile-action" id="mobileTalk" aria-label="Talk">TALK</button>
 <section id="dialog" class="panel" aria-live="polite">
  <div class="dialog-head"><div><div class="who" id="npcName"></div><div class="role" id="npcRole"></div></div><button class="close" id="close">Leave</button></div>
  <div class="messages" id="messages"></div>
  <form class="composer" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Say something…" aria-label="Message"><button type="submit">Send</button></form>
  <div class="fine" id="modeNote">Prototype conversation · This character is not yet connected to a live agent.</div>
 </section>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x081622);scene.fog=new THREE.Fog(0x081622,24,75);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#world').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9e7ed,0x182333,2));
const sun=new THREE.DirectionalLight(0xffe7c2,2.2);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),mat(0x172b32));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(100,50,0x31545a,0x203b42);grid.position.y=.015;grid.material.transparent=true;grid.material.opacity=.18;scene.add(grid);
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.7,7),mat(0x72533b));trunk.position.set(x,.85,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),mat(0x315c50));crown.position.set(x,2.05,z);crown.castShadow=true;scene.add(crown)}
// Commons architecture: a central pavilion, open paths, planted edges and warm beacons.
box(0,1.5,-13,19,3,1.1,0x25434a);box(0,3.1,-13,20,.25,1.4,0x68b9a8);
for(let x=-8;x<=8;x+=4){box(x,2.1,-12.35,.12,1.7,.12,0x9acfc1)}
box(-13,1.3,-4,1,2.6,13,0x1d3744);box(13,1.3,-4,1,2.6,13,0x1d3744);
box(0,.08,1,3,.12,42,0x29454a);
for(let z=-15;z<=17;z+=5){tree(-17,z);tree(17,z)}
for(let x=-10;x<=10;x+=5){const lamp=new THREE.PointLight(0x78d8cb,1.3,8);lamp.position.set(x,2.5,-2);scene.add(lamp);const orb=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0xa8fff0}));orb.position.copy(lamp.position);scene.add(orb)}
// Low plinths give the gathering place scale without obstructing movement.
for(const [x,z,c] of [[-7,-5,0x314f58],[7,-5,0x314f58],[-7,5,0x314f58],[7,5,0x314f58]]){const p=box(x,.45,z,3,.9,2,c);p.material=mat(c)}
const player={x:0,z:8,yaw:0};const avatar=new THREE.Group();scene.add(avatar);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,5,10),mat(0x64c9b7));body.position.y=1.05;body.castShadow=true;avatar.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),mat(0xe0c2a0));head.position.y=1.82;head.castShadow=true;avatar.add(head);
const visor=new THREE.Mesh(new THREE.BoxGeometry(.34,.1,.08),new THREE.MeshBasicMaterial({color:0x17353b}));visor.position.set(0,1.85,-.22);avatar.add(visor);
const npcs=[
 {id:'ralph',name:'RALPH',role:'Improvement & verification',color:0xe2ad63,position:[-5,0,-2],intro:'I’m RALPH. I help turn intentions into verified progress. What are you trying to make happen?',sample:'I can help inspect the evidence, challenge assumptions, and distinguish completed work from activity. My live work context is not connected in this prototype.'},
 {id:'architect',name:'THE ARCHITECT',role:'Systems & connections',color:0x6f9ee8,position:[5,0,-3],intro:'I’m here to think across the whole system. What are you exploring?',sample:'I can reason about how pieces fit together. I do not yet have a live connection to your repositories or other agents.'},
 {id:'scribe',name:'THE SCRIBE',role:'Memory & institutional record',color:0xb58be5,position:[-5,0,5],intro:'I keep track of ideas, decisions, and the story behind the work. What should we discuss?',sample:'A connected version could retrieve approved records and conversations. This prototype does not access your private records.'},
 {id:'builder',name:'THE BUILDER',role:'Making & experimentation',color:0x70c58b,position:[5,0,5],intro:'I’m ready to turn a good idea into something you can try. What are we building?',sample:'I can discuss implementation and prototype ideas, but I cannot execute your repository tasks from this disconnected demo.'}
];
const npcMeshes=[];
for(const n of npcs){const g=new THREE.Group();g.position.set(...n.position);scene.add(g);const robe=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,5,10),mat(n.color));robe.position.y=1.02;robe.castShadow=true;g.add(robe);const face=new THREE.Mesh(new THREE.SphereGeometry(.29,18,14),mat(0xe5c9aa));face.position.y=1.83;face.castShadow=true;g.add(face);const eyeMat=mat(0x182c35,.4);for(const x of [-.1,.1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeMat);eye.position.set(x,1.86,-.25);g.add(eye)}const ring=new THREE.Mesh(new THREE.TorusGeometry(.62,.035,8,32),new THREE.MeshBasicMaterial({color:n.color,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;ring.position.y=.08;g.add(ring);const label=document.createElement('div');label.textContent=n.name;label.style.cssText='position:absolute;color:white;font:700 11px system-ui;letter-spacing:.12em;text-shadow:0 2px 8px #000;white-space:nowrap;pointer-events:none';document.body.appendChild(label);npcMeshes.push({data:n,group:g,label})}
avatar.position.set(player.x,0,player.z);
let active=null,near=null,locked=false,keys={},yaw=0,pitch=-.2;
const dialog=document.querySelector('#dialog'),messages=document.querySelector('#messages'),input=document.querySelector('#chatInput');
function addMessage(text,user=false){const d=document.createElement('div');d.className='msg'+(user?' user':'');d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function openChat(n){active=n;dialog.classList.add('open');document.querySelector('#npcName').textContent=n.name;document.querySelector('#npcRole').textContent=n.role;messages.innerHTML='';addMessage(n.intro);input.focus();if(document.pointerLockElement)document.exitPointerLock()}
function closeChat(){active=null;dialog.classList.remove('open')}
document.querySelector('#close').onclick=closeChat;
document.querySelector('#chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||!active)return;addMessage(text,true);input.value='';const send=document.querySelector('#chatForm button');send.disabled=true;
 try{const endpoint=window.NGL_AGENT_ENDPOINT;if(endpoint){const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:active.id,message:text,conversation_id:active.id})});if(!res.ok)throw new Error('Agent endpoint returned '+res.status);const data=await res.json();addMessage(data.reply??data.message??'The agent returned no message.');document.querySelector('#connection').textContent='CONNECTED AGENT';document.querySelector('#modeNote').textContent='Live agent endpoint connected.'}
 else{await new Promise(r=>setTimeout(r,450));addMessage(active.sample+'\n\nYou said: “'+text+'”');}
 }catch(err){addMessage('I could not reach the configured agent: '+err.message)}finally{send.disabled=false;input.focus()}
});
function findNearby(){let best=null,dist=1e9;for(const o of npcMeshes){const d=Math.hypot(player.x-o.data.position[0],player.z-o.data.position[2]);if(d<dist){dist=d;best=o.data}}return dist<2.5?best:null}
function tryTalk(){if(near)openChat(near)}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&!active)tryTalk();if(e.key==='Escape')closeChat()});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('click',()=>{if(!active&&innerWidth>700)renderer.domElement.requestPointerLock?.()});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.65,Math.min(.2,pitch-e.movementY*.0018))}});
document.querySelector('#mobileTalk').onclick=tryTalk;
let stick={x:0,y:0};const pad=document.querySelector('#stick'),nub=document.querySelector('#nub');let touching=false;
pad.addEventListener('pointerdown',e=>{touching=true;pad.setPointerCapture(e.pointerId);moveStick(e)});
pad.addEventListener('pointermove',e=>{if(touching)moveStick(e)});
function moveStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.min(34,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);stick.x=Math.cos(a)*len/34;stick.y=Math.sin(a)*len/34;nub.style.transform='translate('+Math.cos(a)*len+'px,'+Math.sin(a)*len+'px)'}
function endStick(){touching=false;stick={x:0,y:0};nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',endStick);pad.addEventListener('pointercancel',endStick);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-stick.y;
 const side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x;
 if(!active){const len=Math.hypot(forward,side);if(len>.08){const f=forward/Math.max(1,len),s=side/Math.max(1,len),speed=5.2*dt;player.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;player.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*s)*speed;player.x=THREE.MathUtils.clamp(player.x,-11,11);player.z=THREE.MathUtils.clamp(player.z,-10,18);avatar.rotation.y=Math.atan2(Math.sin(yaw)*f+Math.cos(yaw)*s,-Math.cos(yaw)*f+Math.sin(yaw)*s)}}
 avatar.position.set(player.x,0,player.z);
 const desired=new THREE.Vector3(player.x+Math.sin(yaw)*9,5.8+pitch*5,player.z+Math.cos(yaw)*9);camera.position.lerp(desired,.09);camera.lookAt(player.x,1.15,player.z);
 near=findNearby();document.querySelector('#nearby').textContent=near&&!active?' '+near.name+'  ·  Press E / TAP TALK':'';
 document.querySelector('#hint').style.display=active?'none':'block';
 for(const o of npcMeshes){const p=o.group.position.clone();p.y+=2.55;p.project(camera);o.label.style.left=((p.x*.5+.5)*innerWidth)+'px';o.label.style.top=((-p.y*.5+.5)*innerHeight)+'px';o.label.style.transform='translate(-50%,-50%)';o.label.style.opacity=p.z<1?'1':'0';o.group.rotation.y+=Math.sin(clock.elapsedTime*.7+o.data.position[0])*.0008}
 renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
